<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | ByteFest</title><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar"><a class="brand" href="index.html"><span>BYTE</span>FEST <small>2026</small></a><nav><a href="index.html">Public Site</a></nav></header>
<main class="section"><div class="section-heading"><p class="eyebrow">ORGANIZER PANEL • DEMO</p><h1>Registrations</h1><p>Filter and export participant data.</p></div>
<div class="admin-tools"><select id="filter"><option>All Events</option><option>UI Showdown</option><option>Code Sprint</option><option>Bug Hunt</option><option>Tech Quiz</option><option>Checkmate</option></select><button id="export" class="btn primary">Export CSV</button><button id="clear" class="btn ghost">Clear Demo Data</button></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Event</th><th>Team</th><th>Leader</th><th>College</th><th>Email</th><th>Payment</th><th>Reference</th></tr></thead><tbody id="rows"></tbody></table></div></main><footer><p>© 2026 ByteFest</p></footer><script>
let data=JSON.parse(localStorage.getItem("bytefest_registrations")||"[]");const filter=document.querySelector("#filter"),rows=document.querySelector("#rows");
function render(){const f=filter.value;rows.innerHTML=data.filter(x=>f==="All Events"||x.event===f).map(x=>`<tr><td>${x.registrationId}</td><td>${x.event}</td><td>${x.teamName}</td><td>${x.leaderName}</td><td>${x.college}</td><td>${x.email}</td><td>${x.paymentMethod}</td><td>${x.transactionId||"—"}</td></tr>`).join("")||`<tr><td colspan="8">No registrations found.</td></tr>`}
filter.onchange=render;render();
document.querySelector("#export").onclick=()=>{const cols=["registrationId","event","teamName","leaderName","college","department","year","email","phone","member1","member2","paymentMethod","transactionId","createdAt"];const csv=[cols.join(","),...data.map(x=>cols.map(k=>`"${String(x[k]??"").replaceAll('"','""')}"`).join(","))].join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="bytefest-registrations.csv";a.click();}
document.querySelector("#clear").onclick=()=>{if(confirm("Delete demo registrations from this browser?")){localStorage.removeItem("bytefest_registrations");data=[];render();}}
</script></body></html>
